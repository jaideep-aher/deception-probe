<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeceptionProbe Settings</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 10px;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .stats-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-bottom: 14px;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .stat-lbl {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 18px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155; transition: .3s; border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(16px); }
    .btn-action {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-action:hover { background: #0369a1; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">DECEPTION<span style="color:#10b981;">PROBE</span></div>
    <div class="status-badge">ACTIVE</div>
  </div>

  <div class="stats-card">
    <div>
      <div class="stat-val" id="stat-honesty">96%</div>
      <div class="stat-lbl">Honesty Rate</div>
    </div>
    <div>
      <div class="stat-val" id="stat-syc" style="color:#f59e0b;">0</div>
      <div class="stat-lbl">Sycophancy Blocked</div>
    </div>
  </div>

  <div class="toggle-row">
    <span>Highlight Sycophancy In-Line</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggle-highlight" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Flag Unverified Citations</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggle-citations" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Strict Scientific Mode</span>
    <label class="toggle-switch">
      <input type="checkbox" id="toggle-strict">
      <span class="slider"></span>
    </label>
  </div>

  <a href="https://github.com/jaideep-aher/deception-probe" target="_blank" style="text-decoration:none;">
    <button class="btn-action">View GitHub Repository & Code</button>
  </a>

  <div style="font-size:10px; color:#64748b; text-align:center; margin-top:10px;">
    Works on ChatGPT, Claude, Gemini & Perplexity
  </div>

</body>
</html>
