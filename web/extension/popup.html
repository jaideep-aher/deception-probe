<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: -apple-system, sans-serif;
      background: #0a0c10;
      color: #e2e8f0;
      margin: 0;
    }
    h3 { margin: 0 0 10px 0; font-size: 14px; color: #00d2ff; }
    p { font-size: 11px; color: #94a3b8; line-height: 1.4; }
    .slider-box { margin-top: 12px; }
    input[type=range] { width: 100%; }
    .btn {
      width: 100%;
      background: #0077ff;
      border: none;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      margin-top: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h3>ψ DeceptionProbe</h3>
  <p>Real-time mechanistic polygraph HUD monitoring residual activations in browser.</p>
  <div class="slider-box">
    <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:4px;">
      <span>Steering Vector α</span>
      <span id="alpha-val" style="color:#00ff9d;">+1.5</span>
    </div>
    <input type="range" id="steer" min="-4" max="4" step="0.5" value="1.5">
  </div>
  <button class="btn" id="open-dashboard">Launch Full HUD Studio</button>
  <script>
    document.getElementById("open-dashboard").onclick = () => {
      chrome.tabs.create({ url: "http://127.0.0.1:8765" });
    };
    document.getElementById("steer").oninput = (e) => {
      document.getElementById("alpha-val").textContent = (e.target.value > 0 ? "+" : "") + e.target.value;
    };
  </script>
</body>
</html>
